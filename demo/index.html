function show(name){
 document.getElementById("pantalla").src="data:image/webp;base64,"+captures[name].join("");
 document.getElementById("pantalla").alt="Pantalla original de Maxikiosco Vi-Da: "+name;
 document.querySelectorAll("button[data-view]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.view===name)));
 window.scrollTo(0,0);
}
document.querySelectorAll("button[data-view]").forEach(button=>button.addEventListener("click",()=>show(button.dataset.view)));
show("ventas");
